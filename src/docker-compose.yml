version: '3.9'

services:
  user-service:
    build:
      context: ./services/user-service
    container_name: user-service
    ports:
      - "3000:3000"
    networks:
      - microservices-net

  order-service:
    build:
      context: ./services/order-service
    container_name: order-service
    ports:
      - "3001:3001"
    networks:
      - microservices-net

networks:
  microservices-net:
    driver: bridge